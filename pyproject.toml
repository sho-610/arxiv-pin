[project]
name = "arxiv-pin"
version = "0.1.0"
description = "arXiv の HTML 論文で、式・図・表をサイドパネルにピン留めしながら読むためのツール"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "sho-610" }]
keywords = ["arxiv", "html", "reading", "papers"]
dependencies = [
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
]

[project.scripts]
arxiv-pin = "arxiv_pin.core:main"

[project.urls]
Repository = "https://github.com/sho-610/arxiv-pin"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/arxiv_pin"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "mypy>=1.10",
    "ruff>=0.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
files = ["src", "tests"]
strict = true

[[tool.mypy.overrides]]
module = ["bs4.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
